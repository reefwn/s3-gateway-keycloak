services:
  app:
    build:
      context: .
      target: development
    command: bun dev
    environment:
      DATABASE_URL: postgres://s3_browser:s3_browser@postgres:5432/s3_browser
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bun_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: s3_browser
      POSTGRES_USER: s3_browser
      POSTGRES_PASSWORD: s3_browser
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s3_browser -d s3_browser"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  bun_modules:
  postgres_data:
