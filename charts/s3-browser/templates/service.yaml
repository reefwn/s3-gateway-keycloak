apiVersion: v1
kind: Service
metadata:
  name: {{ include "s3-browser.fullname" . }}
  labels:
    {{- include "s3-browser.labels" . | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      protocol: TCP
      targetPort: http
  selector:
    {{- include "s3-browser.selectorLabels" . | nindent 4 }}
