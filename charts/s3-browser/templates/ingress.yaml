{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "s3-browser.fullname" . }}
  labels:
    {{- include "s3-browser.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when ingress.enabled is true" .Values.ingress.host }}
      secretName: {{ required "ingress.tlsSecretName is required when ingress.enabled is true" .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled is true" .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "s3-browser.fullname" . }}
                port:
                  number: {{ .Values.app.service.port }}
{{- end }}
