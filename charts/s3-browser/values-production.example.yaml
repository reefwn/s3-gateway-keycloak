existingSecret:
  name: deployment-secrets

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/s3-browser

app:
  nextAuthUrl: https://s3-browser.internal.example
  keycloakIssuer: https://keycloak.internal.example/realms/internal
  allowedBuckets: reports,uploads
  # If nextAuthUrl above must be http:// — e.g. deployed behind an internal
  # service mesh / gateway that only exposes HTTP inside a private network —
  # uncomment this. Leave it unset (or false) for any deployment reachable
  # from outside a trusted internal network.
  # allowInsecureHttp: true

postgresql:
  persistence:
    storageClass: gp3
    size: 20Gi
